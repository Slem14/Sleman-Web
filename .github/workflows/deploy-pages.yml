name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The trailing "..." builds @wg/web *and its workspace dependencies* in
      # dependency order. Without it, packages that compile to dist/ are
      # missing and the build fails on a clean checkout.
      - name: Build static site
        run: pnpm exec turbo run build --filter=@wg/web...
        env:
          # Public base URL of the analysis API. Inlined into the client bundle
          # at build time, so it must be the URL the BROWSER can reach. Set as
          # a repository variable (Settings → Secrets and variables → Actions →
          # Variables). Left empty, the upload page shows an honest
          # "not switched on yet" state rather than a control that cannot work.
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          # "true" while the analysis runs on a free provider tier, whose terms
          # do not guarantee the no-training promise the privacy notice makes.
          # Makes the upload page warn users. Remove once a reviewed provider
          # agreement is in place.

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # output:"export" + custom distDir => static site lands here
          path: apps/web/.next-build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
