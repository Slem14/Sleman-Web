# Render blueprint for the analysis API.
#
# The web app is a static export on GitHub Pages; only the API needs a running
# process. Keeping them on separate hosts preserves the trust boundary from
# docs/architecture/trust-boundaries.md — document bytes reach exactly one
# service, and the static site can never hold provider credentials.
#
# Secrets (GEMINI_API_KEY) are set in the Render dashboard, never in this file.

services:
  - type: web
    name: welcome-germany-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt # EU processing, per master-spec §8
    healthCheckPath: /health
    # Redeploy on every push to main. Without this the service silently keeps
    # serving whatever was built when the blueprint was first applied — /health
    # answers "ok" while newly added routes 404. See /version for what is
    # actually running.
    autoDeploy: true
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      # The exact browser origins allowed by CORS — deny-by-default (TB-1).
      # Both are listed only for the duration of the move to the new domain:
      # DNS and the GitHub Pages custom domain do not switch at the same
      # instant, and uploads must keep working from whichever origin is
      # currently serving. Drop slemanparwiz.com once the move has settled.
      - key: WEB_ORIGIN
        value: https://welcome-deutschland.de,https://slemanparwiz.com
      - key: ANALYSIS_PROVIDER
        value: gemini
      - key: ANALYSIS_MODEL
        value: gemini-3.6-flash
      # Abuse controls. Deliberately tight on a free instance.
      - key: RATE_LIMIT_MAX
        value: "5"
      - key: REQUEST_TIMEOUT_MS
        value: "90000"
      # Set in the Render dashboard, never committed.
      - key: GEMINI_API_KEY
        sync: false
